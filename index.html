<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>読書記録</title>
<style>
  :root {
    --bg: #f5f3ee;
    --card-bg: #ffffff;
    --text: #2f2b26;
    --text-sub: #6b645c;
    --accent: #5b6b58;
    --accent-bg: #e8e3d8;
    --border: #ddd6c9;
  }

  * {
    box-sizing: border-box;
  }

  body {
    margin: 0;
    padding: 0;
    background: var(--bg);
    color: var(--text);
    font-family: "Hiragino Kaku Gothic ProN", "Hiragino Sans", "Yu Gothic", "Meiryo", sans-serif;
    line-height: 1.7;
  }

  header {
    padding: 32px 20px 16px;
    max-width: 1000px;
    margin: 0 auto;
  }

  h1 {
    font-size: 1.6rem;
    margin: 0 0 20px;
    color: var(--text);
  }

  .search-box {
    width: 100%;
    padding: 12px 14px;
    font-size: 1rem;
    border: 1px solid var(--border);
    border-radius: 8px;
    background: var(--card-bg);
    color: var(--text);
  }

  .search-box:focus {
    outline: 2px solid var(--accent);
    outline-offset: 1px;
  }

  .tag-list {
    display: flex;
    flex-wrap: wrap;
    gap: 8px;
    margin-top: 16px;
  }

  .tag-button {
    padding: 6px 14px;
    font-size: 0.9rem;
    border: 1px solid var(--border);
    border-radius: 999px;
    background: var(--card-bg);
    color: var(--text-sub);
    cursor: pointer;
  }

  .tag-button:hover {
    border-color: var(--accent);
  }

  .tag-button.active {
    background: var(--accent);
    border-color: var(--accent);
    color: #ffffff;
  }

  main {
    max-width: 1000px;
    margin: 0 auto;
    padding: 8px 20px 60px;
  }

  .book-grid {
    display: grid;
    grid-template-columns: 1fr;
    gap: 16px;
    margin-top: 20px;
  }

  @media (min-width: 768px) {
    .book-grid {
      grid-template-columns: repeat(2, 1fr);
    }
  }

  .book-card {
    background: var(--card-bg);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 18px;
    cursor: pointer;
    display: flex;
    flex-direction: column;
    gap: 8px;
  }

  .book-card:hover {
    border-color: var(--accent);
    box-shadow: 0 2px 8px rgba(0, 0, 0, 0.06);
  }

  .book-title {
    font-size: 1.05rem;
    font-weight: bold;
    margin: 0;
    color: var(--text);
  }

  .book-author {
    font-size: 0.9rem;
    color: var(--text-sub);
    margin: 0;
  }

  .book-tags {
    display: flex;
    flex-wrap: wrap;
    gap: 6px;
  }

  .book-tag {
    font-size: 0.75rem;
    padding: 2px 10px;
    border-radius: 999px;
    background: var(--accent-bg);
    color: var(--accent);
  }

  .book-comment {
    font-size: 0.9rem;
    color: var(--text);
    margin: 4px 0 0;
    white-space: pre-line;
  }

  .no-result {
    text-align: center;
    color: var(--text-sub);
    padding: 40px 0;
  }
</style>
</head>
<body>

<header>
  <h1>読書記録</h1>
  <input type="search" id="searchBox" class="search-box" placeholder="タイトル・著者で検索">
  <div id="tagList" class="tag-list"></div>
</header>

<main>
  <div id="bookGrid" class="book-grid"></div>
  <p id="noResult" class="no-result" hidden>該当する本が見つかりませんでした。</p>
</main>

<script>
  // ここから本のデータ（追加・編集はこの配列だけでOK）
  const books = [
    {
      title: "『“アニメ”経済圏』",
      author: "平島綾子（日経BP）",
      tags: ["経営", "マーケティング"],
      comment: "「アニメが海外で人気らしい」で止まっていた自分に、海外での勝ち筋を見せてくれた一冊。\n大事なのは「人気」の有無ではなく、どこで収益化の設計図を握るかだった。",
      url: "https://note.com/noujoujin/n/n966d6aa2c5da"
    },
    {
      title: "『1割の顧客で9割売り上げる「沼るファン」のつくり方』",
      author: "清水群（かんき出版）",
      tags: ["マーケティング", "AI"],
      comment: "AIが消したのは品質の差ではなく、差がある場所を移しただけ。\n差は情報の非対称性から、熱量の非対称性へと移動しただけらしい。",
      url: "https://note.com/noujoujin/n/n8220de334141"
    },
    {
      title: "『だからベンチャーキャピタルはやめられない』",
      author: "岩澤脩（ディスカヴァー・トゥエンティワン）",
      tags: ["経営"],
      comment: "市場・プロダクト・実行という他人の採点表で、自分の事業を採点してみた。\n甘くつけていた項目ほど、後で一番効いてくる箇所だった。",
      url: "https://note.com/noujoujin/n/nfc4a027137d9"
    },
    {
      title: "『AI過大評価社会――AIには何ができて、何ができないか』",
      author: "Arvind Narayanan & Sayash Kapoor（草思社）",
      tags: ["AI", "社会"],
      comment: "AIを信じすぎても、軽く見すぎても危ない。推進する側だからこそ読んだ。\n「できる」と「賢い」は別物だと突きつけられ、言葉遣いから見直すことになった。",
      url: "https://note.com/noujoujin/n/ndd8e270167c6"
    },
    {
      title: "『AIの時代に 頭がよくなる人 悪くなる人』",
      author: "岡瑞起（日経BP）",
      tags: ["AI"],
      comment: "AIとの「協働の時代」は、思ったより短いかもしれない。\n短いからこそ、今どう考える力を鍛えるかが分かれ目になる。",
      url: "https://note.com/noujoujin/n/nf8a091a7ca09"
    },
    {
      title: "『AI大格差　最先端の研究が明かす仕事と給料の未来』",
      author: "宮本弘曉（日本評論社）",
      tags: ["AI", "社会"],
      comment: "AIが賢くなるほど、人間の「問い」が問われる。境界はギザギザしている。\nきれいな線引きを探すより、ギザギザのまま向き合う方が現実的だった。",
      url: "https://note.com/noujoujin/n/n84c6f01d3dc0"
    },
    {
      title: "『フィジカルAIの衝撃』",
      author: "田中道昭（朝日新聞出版）",
      tags: ["AI", "テクノロジー"],
      comment: "AIが画面の外へ出て、畑や工場に降りてくる。その地図。\n農業の現場でも「画面の外」の設計をどう握るかが次の勝負になる。",
      url: "https://note.com/noujoujin/n/nc79ae80e6f18"
    },
    {
      title: "『おいしい日本の野菜が消える日―二極化する農業の未来』",
      author: "久松達央（光文社新書）",
      tags: ["農業", "社会"],
      comment: "二極化は感情論ではなく「モジュール化」という構造から起きている。\n「頑張れば報われる」では説明できない構造を、数字で突きつけられた。",
      url: "https://note.com/noujoujin/n/na88101389fd8"
    },
    {
      title: "『これからの「農業」の話をしよう』",
      author: "吉田巧（游藝舎）",
      tags: ["農業", "経営"],
      comment: "なぜ「良い野菜」は、それだけでは稼げないのか。作る競争から降りる話。\n降りた先に何を作るかまで踏み込んでいて、他人事にはできなかった。",
      url: "https://note.com/noujoujin/n/n7a72de197484"
    },
    {
      title: "『限界国家』",
      author: "楡周平（双葉社）",
      tags: ["社会"],
      comment: "人口減少は、働き手が減る問題である前に、買う人が減る問題だった。\n供給側ばかり議論していた自分への、静かな警告として読んだ。",
      url: "https://note.com/noujoujin/n/n0e50d7fbe5a7"
    }
  ];
  // ここまで本のデータ

  const searchBox = document.getElementById("searchBox");
  const tagListEl = document.getElementById("tagList");
  const bookGridEl = document.getElementById("bookGrid");
  const noResultEl = document.getElementById("noResult");

  let activeTag = null;

  function renderTagButtons() {
    const allTags = [...new Set(books.flatMap(book => book.tags))];

    const allButton = document.createElement("button");
    allButton.type = "button";
    allButton.className = "tag-button" + (activeTag === null ? " active" : "");
    allButton.textContent = "すべて";
    allButton.addEventListener("click", () => {
      activeTag = null;
      renderTagButtons();
      renderBooks();
    });
    tagListEl.appendChild(allButton);

    allTags.forEach(tag => {
      const button = document.createElement("button");
      button.type = "button";
      button.className = "tag-button" + (activeTag === tag ? " active" : "");
      button.textContent = tag;
      button.addEventListener("click", () => {
        activeTag = activeTag === tag ? null : tag;
        renderTagButtons();
        renderBooks();
      });
      tagListEl.appendChild(button);
    });
  }

  function renderBooks() {
    const keyword = searchBox.value.trim().toLowerCase();

    const filtered = books.filter(book => {
      const matchesKeyword =
        keyword === "" ||
        book.title.toLowerCase().includes(keyword) ||
        book.author.toLowerCase().includes(keyword);
      const matchesTag = activeTag === null || book.tags.includes(activeTag);
      return matchesKeyword && matchesTag;
    });

    bookGridEl.innerHTML = "";

    filtered.forEach(book => {
      const card = document.createElement("div");
      card.className = "book-card";
      card.tabIndex = 0;
      card.setAttribute("role", "link");

      const title = document.createElement("p");
      title.className = "book-title";
      title.textContent = book.title;

      const author = document.createElement("p");
      author.className = "book-author";
      author.textContent = book.author;

      const tagsEl = document.createElement("div");
      tagsEl.className = "book-tags";
      book.tags.forEach(tag => {
        const tagEl = document.createElement("span");
        tagEl.className = "book-tag";
        tagEl.textContent = tag;
        tagsEl.appendChild(tagEl);
      });

      const comment = document.createElement("p");
      comment.className = "book-comment";
      comment.textContent = book.comment;

      card.append(title, author, tagsEl, comment);

      const openBook = () => window.open(book.url, "_blank", "noopener");
      card.addEventListener("click", openBook);
      card.addEventListener("keydown", event => {
        if (event.key === "Enter" || event.key === " ") {
          event.preventDefault();
          openBook();
        }
      });

      bookGridEl.appendChild(card);
    });

    noResultEl.hidden = filtered.length !== 0;
  }

  searchBox.addEventListener("input", renderBooks);

  renderTagButtons();
  renderBooks();
</script>

</body>
</html>
